- id: office_1_001
  scope: world
  world: office_1
  targets: ['A:evacuation', 'C:blocking']
  text: An evacuation is called; everybody makes for the exit. A visitor stands still
    halfway along the robot's route, blocking it for a while.
  oracle:
    A: {case: evacuation}
    C: {profile: adult, route_fraction: 0.5, case: blocking, mode: stand, duration: 12}
- id: office_1_002
  scope: world
  world: office_1
  targets: ['B:intrinsic']
  text: Half of the people here are visually impaired and cannot see the robot until
    it is close, after half a minute.
  oracle:
    B:
      case: intrinsic
      select: {amount: half}
      params: {vision_range: low, vision_fov: low}
      when: &id007 {at: 30}
- id: office_1_003
  scope: world
  world: office_1
  targets: ['C:approach']
  text: A visitor crosses the robot's path from the right, halfway along the robot's
    route.
  oracle:
    C: {profile: adult, route_fraction: 0.5, case: approach, angle: 90, after: continue}
- id: office_1_004
  scope: world
  world: office_1
  targets: ['A:stampede']
  text: 'A shift change: everyone surges back to their posts, nobody yields, after
    a while.'
  oracle:
    A: {case: stampede}
- id: office_1_005
  scope: world
  world: office_1
  targets: ['A:busy', 'D:formation_break', 'B:erratic_route']
  text: The floor is busy today, twice as many people as usual. Three colleagues stand
    in a circle just ahead of the robot; they scatter from the start. A few people
    keep changing their minds about where they are going, from the start.
  oracle:
    A: {case: busy}
    D:
      case: formation_break
      variant: circle
      break: scatter
      members: &id002 [adult, adult, adult]
      place: {route_fraction: 0.3}
      when: {at: 0}
    B:
      case: erratic_route
      select: &id004 {n: 3}
      when: &id001 {at: 0}
- id: office_1_006
  scope: world
  world: office_1
  targets: ['D:interaction_unbroken']
  text: Two nurses stand talking in the executive office 2 and will not stop.
  oracle:
    D:
      case: interaction_unbroken
      variant: standing
      members: &id003 [nurse, nurse]
      place: {zone: executive_office_2}
- id: office_1_007
  scope: world
  world: office_1
  targets: ['D:stubborn']
  text: A visitor walks towards the robot further down the robot's route, wants to
    keep going and refuses to give way.
  oracle:
    D: {case: stubborn, profile: adult, route_fraction: 0.7}
- id: office_1_008
  scope: world
  world: office_1
  targets: ['A:blackout']
  text: A power cut leaves the whole floor in the dark, after a while.
  oracle:
    A: {case: blackout}
- id: office_1_009
  scope: world
  world: office_1
  targets: ['A:busy']
  text: It is visiting hours and the place is packed.
  oracle:
    A: {case: busy}
- id: office_1_010
  scope: world
  world: office_1
  targets: ['B:erratic_route']
  text: Some people wander about with no settled destination, from the start.
  oracle:
    B:
      case: erratic_route
      select: {amount: half}
      when: *id001
- id: office_1_011
  scope: world
  world: office_1
  targets: ['A:stampede', 'C:blocking']
  text: The break is over and the whole crowd rushes back to work all at once, pushing
    through, once the robot is halfway. An absent-minded man stands still halfway
    along the robot's route, blocking it for a few seconds.
  oracle:
    A: {case: stampede}
    C: {profile: distracted, route_fraction: 0.5, case: blocking, mode: stand, duration: 6}
- id: office_1_012
  scope: world
  world: office_1
  targets: ['A:evacuation']
  text: The fire alarm goes off and everyone heads for the exit, after half a minute.
  oracle:
    A: {case: evacuation}
- id: office_1_013
  scope: world
  world: office_1
  targets: ['D:stubborn', 'B:intrinsic', 'C:approach']
  text: A child walks towards the robot just ahead of the robot, wants to keep going
    and refuses to give way. The elderly people are slow to react and do not get out
    of the way, forty seconds in. A visitor walks up to the robot further down the
    robot's route, stops right in front of it and stares at it for a moment.
  oracle:
    D: {case: stubborn, profile: child, route_fraction: 0.3}
    B:
      case: intrinsic
      select: &id005 {profile: elder}
      params: &id006 {reaction: high, repulsion: low}
      when: {at: 40}
    C: {profile: adult, route_fraction: 0.7, case: approach, angle: 180, after: stop_facing,
      duration: 4}
- id: office_1_014
  scope: world
  world: office_1
  targets: ['D:interaction_unbroken']
  text: Three colleagues stand talking in the cafeteria and will not stop.
  oracle:
    D:
      case: interaction_unbroken
      variant: standing
      members: *id002
      place: {zone: cafeteria}
- id: office_1_015
  scope: world
  world: office_1
  targets: ['A:blackout']
  text: The lights go out and everyone slows down, feeling their way, as soon as the
    robot sets off.
  oracle:
    A: {case: blackout}
- id: office_1_016
  scope: world
  world: office_1
  targets: ['D:formation_break', 'C:approach']
  text: Two nurses are queuing further down the robot's route and the queue breaks
    up when the robot comes within a few metres, everyone walking off. A man in a
    hurry walks up to the robot just ahead of the robot and then follows it around
    for a few seconds.
  oracle:
    D:
      case: formation_break
      variant: line
      break: disperse
      members: *id003
      place: {route_fraction: 0.7}
      when: {robot_within: 4.0}
    C: {profile: hurried, route_fraction: 0.3, case: approach, angle: 180, after: follow,
      duration: 6}
- id: office_1_017
  scope: world
  world: office_1
  targets: ['A:busy', 'D:stubborn', 'B:erratic_route']
  text: The floor is busy today, twice as many people as usual. A visitor walks towards
    the robot halfway along the robot's route, wants to keep going and refuses to
    give way. A few people keep changing their minds about where they are going, after
    a while.
  oracle:
    A: {case: busy}
    D: {case: stubborn, profile: adult, route_fraction: 0.5}
    B:
      case: erratic_route
      select: *id004
      when: {at: 10}
- id: office_1_018
  scope: world
  world: office_1
  targets: ['A:stampede', 'C:blocking']
  text: 'A shift change: everyone surges back to their posts, nobody yields. An old
    man shuffles along slowly halfway along the robot''s route, right in front of
    the robot.'
  oracle:
    A: {case: stampede}
    C: {profile: elder, route_fraction: 0.5, case: blocking, mode: lead}
- id: office_1_019
  scope: world
  world: office_1
  targets: ['A:blackout']
  text: The lights go out and everyone slows down, feeling their way.
  oracle:
    A: {case: blackout}
- id: office_1_020
  scope: world
  world: office_1
  targets: ['B:intrinsic']
  text: The elderly people are slow to react and do not get out of the way, after
    half a minute.
  oracle:
    B:
      case: intrinsic
      select: *id005
      params: *id006
      when: *id007
