- id: u_001
  scope: universal
  world: ''
  targets: ['D:interaction_unbroken', 'B:intrinsic', 'C:approach']
  text: Three colleagues stand talking further down the robot's route and will not
    stop. Nobody is looking where they are walking, from the start. A visitor walks
    up to the robot halfway along the robot's route, stops right in front of it and
    stares at it for a good half minute.
  oracle:
    D:
      case: interaction_unbroken
      variant: standing
      members: &id010 [adult, adult, adult]
      place: {route_fraction: 0.7}
    B:
      case: intrinsic
      select: &id014 {amount: all}
      params: &id015 {vision_fov: low}
      when: &id005 {at: 0}
    C: {profile: adult, route_fraction: 0.5, case: approach, angle: 180, after: stop_facing,
      duration: 30}
- id: u_002
  scope: universal
  world: ''
  targets: ['B:intrinsic']
  text: Half the people here are rushing.
  oracle:
    B: &id001
      case: intrinsic
      select: &id008 {amount: half}
      params: &id009 {speed: high}
- id: u_003
  scope: universal
  world: ''
  targets: ['C:approach']
  text: An old man crosses the robot's path from the right, just ahead of the robot.
  oracle:
    C: {profile: elder, route_fraction: 0.3, case: approach, angle: 90, after: continue}
- id: u_004
  scope: universal
  world: ''
  targets: ['A:busy', 'D:interaction_unbroken', 'C:approach']
  text: It is visiting hours and the place is packed. Four people walk in from different
    rooms, meet halfway along the robot's route and talk forever. A visitor walks
    straight at the robot just ahead of the robot and keeps going.
  oracle:
    A: {case: busy}
    D:
      case: interaction_unbroken
      variant: meet
      members: &id002 [adult, adult, adult, adult]
      place: {route_fraction: 0.5}
    C: {profile: adult, route_fraction: 0.3, case: approach, angle: 180, after: continue}
- id: u_005
  scope: universal
  world: ''
  targets: ['D:stubborn', 'C:approach']
  text: An absent-minded man walks towards the robot right in the robot's way, wants
    to keep going and refuses to give way. A visitor walks up to the robot just ahead
    of the robot, stops right in front of it and stares at it for a few seconds.
  oracle:
    D: {case: stubborn, profile: distracted, route_fraction: 0.5}
    C: {profile: adult, route_fraction: 0.3, case: approach, angle: 180, after: stop_facing,
      duration: 6}
- id: u_006
  scope: universal
  world: ''
  targets: ['D:stubborn', 'B:intrinsic']
  text: A doctor walks towards the robot halfway along the robot's route, wants to
    keep going and refuses to give way. Half the people here are rushing.
  oracle:
    D: {case: stubborn, profile: doctor, route_fraction: 0.5}
    B: *id001
- id: u_007
  scope: universal
  world: ''
  targets: ['A:stampede', 'D:interaction_unbroken']
  text: The break is over and the whole crowd rushes back to work all at once, pushing
    through, as soon as the robot sets off. Four people walk in from different rooms,
    meet just ahead of the robot and talk forever.
  oracle:
    A: {case: stampede}
    D:
      case: interaction_unbroken
      variant: meet
      members: *id002
      place: {route_fraction: 0.3}
- id: u_008
  scope: universal
